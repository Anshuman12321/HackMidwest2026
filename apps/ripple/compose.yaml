services:
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: ripple
      POSTGRES_PASSWORD: ${RIPPLE_DB_PASSWORD:?Set RIPPLE_DB_PASSWORD}
      POSTGRES_DB: ripple
    volumes:
      - ripple-db:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ripple -d ripple"]
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  ripple-db:
